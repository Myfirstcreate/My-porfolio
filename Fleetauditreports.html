<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AK Garage | Fleet Audit Report</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="supabase-client.js"></script>
	<style>
		:root { --black:#070807; --panel:#101210; --line:#292d29; --text:#f0f3ec; --muted:#8b9388; --lime:#c4f04e; }
		* { box-sizing:border-box; }
		body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 90% 0,#172016 0,transparent 24%),var(--black); font-family:'Space Grotesk',sans-serif; }
		.bg-media { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; opacity:.26; -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.55) 44%,transparent 78%); mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.55) 44%,transparent 78%); }
		.bg-media::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(7,8,7,.4),rgba(7,8,7,.15) 45%,transparent 75%); }
		.bg-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:74% 50%; }
		a { color:inherit; text-decoration:none; }
		.shell { position:relative; z-index:1; max-width:1240px; margin:auto; padding:31px 42px 50px; }
		.topbar { display:flex; justify-content:space-between; align-items:center; padding-bottom:25px; border-bottom:1px solid var(--line); }
		.brand { display:flex; align-items:center; gap:11px; }
		.mark { width:30px; height:30px; display:grid; place-items:center; border-radius:50%; color:var(--black); background:var(--lime); font-size:12px; font-weight:700; }
		.brand strong { display:block; font-size:14px; letter-spacing:.08em; }
		.brand small { display:block; margin-top:3px; color:var(--muted); font:10px 'DM Mono',monospace; letter-spacing:.08em; }
		.back { display:flex; align-items:center; gap:8px; padding:10px 13px; border:1px solid var(--line); border-radius:4px; color:var(--muted); font:11px 'DM Mono',monospace; text-transform:uppercase; }
		.back:hover { color:var(--black); border-color:var(--lime); background:var(--lime); } .back svg { width:15px; }
		.intro { display:flex; justify-content:space-between; align-items:end; gap:20px; padding:36px 0 24px; }
		.eyebrow { margin:0 0 8px; color:var(--lime); font:11px 'DM Mono',monospace; letter-spacing:.16em; text-transform:uppercase; }
		h1 { margin:0; font-size:clamp(30px,4vw,47px); letter-spacing:-.06em; line-height:1; }
		.intro p { max-width:360px; margin:0; color:var(--muted); font-size:13px; line-height:1.5; }

		/* ---- Calendar card ---- */
		.calendar { border:1px solid var(--line); border-radius:8px; background:rgba(16,18,16,.94); overflow:hidden; }
		.cal-top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:20px 22px; border-bottom:1px solid var(--line); }
		.cal-month { margin:0; font-size:clamp(24px,3.2vw,34px); font-weight:400; letter-spacing:-.03em; line-height:1; }
		.cal-month span { color:var(--muted); }
		.cal-tools { display:flex; align-items:center; gap:7px; margin-left:auto; }
		.cal-total { display:flex; flex-direction:column; gap:2px; padding:7px 14px; border:1px solid var(--line); border-left:2px solid var(--lime); border-radius:6px; background:#0b0d0b; }
		.cal-total span { color:var(--muted); font:9px 'DM Mono',monospace; letter-spacing:.1em; text-transform:uppercase; }
		.cal-total b { color:var(--lime); font-size:19px; font-weight:500; letter-spacing:-.02em; }
		.cal-btn { display:grid; place-items:center; min-width:34px; height:34px; padding:0 11px; border:1px solid var(--line); border-radius:4px; color:var(--muted); background:#0b0d0b; font:10px 'DM Mono',monospace; text-transform:uppercase; cursor:pointer; }
		.cal-btn:hover { color:var(--black); border-color:var(--lime); background:var(--lime); }
		.cal-btn svg { width:15px; height:15px; }
		.cal-week-link { margin-right:8px; padding:0 0 2px; border:0; border-bottom:1px dashed rgba(196,240,78,.55); color:var(--lime); background:none; font:11px 'DM Mono',monospace; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
		.cal-week-link:hover { color:#fff; border-bottom-color:#fff; }
		.range-date { padding:6px 8px; border:1px solid var(--line); border-radius:4px; color:var(--text); background:#0b0d0b; color-scheme:dark; font:10px 'DM Mono',monospace; }
		.range-dash { color:var(--muted); font:10px 'DM Mono',monospace; text-transform:uppercase; }
		.grid-wrap { overflow:auto; }
		.cal-grid { display:grid; grid-template-columns:52px repeat(7,minmax(118px,1fr)); min-width:900px; }
		.cal-dow { padding:11px 12px; border-bottom:1px solid var(--line); border-left:1px solid var(--line); color:#697268; font:10px 'DM Mono',monospace; letter-spacing:.1em; text-transform:uppercase; }
		.cal-dow.week { border-left:0; }
		.cal-week { display:flex; align-items:flex-start; justify-content:flex-end; padding:9px 10px 0 0; border-bottom:1px solid var(--line); color:#4c544b; font:10px 'DM Mono',monospace; }
		.cal-cell { position:relative; min-height:112px; padding:22px 6px 7px; border-left:1px solid var(--line); border-bottom:1px solid var(--line); background:transparent; cursor:pointer; text-align:left; font:inherit; color:inherit; }
		.cal-cell:hover { background:#151a15; }
		.cal-cell.out { opacity:.42; }
		.cal-cell.selected { box-shadow:inset 0 0 0 1px var(--lime); }
		.cal-cell.has-expense { background:rgba(196,240,78,.07); }
		.cal-cell.has-expense:hover { background:rgba(196,240,78,.14); }
		.cal-cell.has-expense::after { content:''; position:absolute; top:10px; right:9px; width:6px; height:6px; border-radius:50%; background:var(--lime); box-shadow:0 0 0 3px rgba(196,240,78,.16); }
		.cal-amount { position:absolute; left:9px; bottom:8px; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--lime); font:9px 'DM Mono',monospace; letter-spacing:.02em; }
		.cal-date { position:absolute; top:6px; left:9px; color:#a9b1a6; font:12px 'DM Mono',monospace; }
		.cal-cell.today .cal-date { display:grid; place-items:center; width:21px; height:21px; top:2px; left:5px; border-radius:50%; color:#fff; background:#e5484d; font-weight:500; }

		/* ===== Report paper view — same navy/gold sheet as the Maintenance report ===== */
		body.report-open .intro,body.report-open .calendar { display:none; }
		#report-view { margin-top:6px; }
		#report-view[hidden] { display:none; }
		.report-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
		.report-bar .rbtn { padding:8px 13px; border:1px solid var(--lime); border-radius:4px; color:var(--black); background:var(--lime); font:600 11px 'Space Grotesk',sans-serif; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; }
		.report-bar .rbtn:hover { filter:brightness(1.08); }
		.report-bar .rbtn.ghost { color:var(--text); border-color:var(--line); background:transparent; }
		.report-bar .rbtn.ghost:hover { border-color:var(--muted); filter:none; }
		.report-bar .rbtn:disabled { opacity:.6; cursor:default; }
		.report-bar .rbtn.danger { color:#ff9d95; border-color:rgba(229,72,77,.55); background:transparent; }
		.report-bar .rbtn.danger:hover { color:#fff; border-color:#e5484d; background:#e5484d; filter:none; }
		.report-status { margin-left:auto; color:var(--muted); font:10px 'DM Mono',monospace; text-transform:uppercase; }
		.report-form { margin-bottom:14px; padding:16px 18px; border:1px solid var(--line); border-radius:8px; background:rgba(16,18,16,.96); }
		.report-form[hidden] { display:none; }
		.rf-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
		.rf-field label { display:block; margin-bottom:5px; color:var(--muted); font:9px 'DM Mono',monospace; letter-spacing:.1em; text-transform:uppercase; }
		.rf-field input,.rf-field select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px; color:var(--text); background:#080a08; font:12px 'Space Grotesk',sans-serif; outline:0; }
		.rf-field input:focus,.rf-field select:focus { border-color:var(--lime); }
		.rf-actions { display:flex; gap:8px; margin-top:12px; }
		.rf-hint { display:block; margin-top:5px; color:var(--muted); font:9px 'DM Mono',monospace; letter-spacing:.06em; }
		.rp .rp-table td .ed { width:100%; padding:4px 5px; border:1px solid #d9d2c1; border-radius:3px; background:#fff; color:#2b2a26; font-family:'Space Grotesk',sans-serif; font-size:11px; }
		.rp .rp-table td .ed:focus { border-color:#a8844a; outline:0; }
		.rp .rp-table td.num .ed { text-align:right; }
		.rp .rp-table td .ed-pay { margin-right:4px; }
		.rp .ed-del { display:inline-grid; place-items:center; width:20px; height:20px; padding:0; border:1px solid #d9d2c1; border-radius:3px; color:#a8332b; background:#fff; font:11px 'DM Mono',monospace; cursor:pointer; vertical-align:middle; }
		.rp .ed-del:hover { color:#fff; border-color:#a8332b; background:#a8332b; }
		@media(max-width:900px) { .rf-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
		.report-sheet { max-width:1180px; margin:0 auto; padding:18px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 14px 34px rgba(0,0,0,.45); }
		.rp { --serif:Georgia,'Times New Roman',serif; border-top:3px solid #a8844a; background:#fff; color:#2b2a26; font-size:12px; }
		.rp .rp-top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 18px; background:#14213a; border-bottom:2px solid #a8844a; }
		.rp .rp-brand { flex:1; display:flex; align-items:center; }
		.rp .rp-brand b { position:relative; color:#c9a96a; font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
		.rp .rp-brand b::after { content:""; display:block; height:3px; margin-top:8px; background:linear-gradient(to right,#14213a 0 72%,#a8844a 72% 100%); }
		.rp .rp-brand small { display:block; margin-top:4px; color:#c9a96a; font:600 10px 'DM Mono',monospace; letter-spacing:1.2px; text-transform:uppercase; }
		.rp .rp-meta { display:flex; gap:8px; text-align:center; }
		.rp .rp-meta>div { min-width:150px; padding:10px 16px; border:1px solid #a8844a; border-radius:10px; background:#1b2b49; }
		.rp .rp-meta span { display:block; color:#c9a96a; font:600 10.5px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.6px; }
		.rp .rp-meta b { display:block; margin-top:2px; color:#fff; font-family:var(--serif); font-size:15px; font-weight:400; }
		.rp .rp-info { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:10px; background:#e2dccd; border:1px solid #e2dccd; }
		.rp .rp-info>div { padding:8px 10px; background:#fbf9f5; }
		.rp .rp-info span { display:block; color:#8a7f6a; font:600 10.5px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.6px; }
		.rp .rp-info b { color:#14213a; font-family:var(--serif); font-size:14.5px; font-weight:400; }
		.rp table.rp-table { width:100%; border-collapse:collapse; font-size:12px; }
		.rp .rp-table th { padding:7px 8px; border-bottom:0; background:#14213a; color:#fff; font:700 10.5px 'DM Mono',monospace; letter-spacing:.8px; text-align:left; text-transform:uppercase; }
		.rp .rp-table td { padding:7px 8px; border-bottom:1px solid #efeadf; color:#2b2a26; vertical-align:top; }
		.rp .rp-table td.num { text-align:right; white-space:nowrap; font-family:var(--serif); }
		.rp .rp-table td.rp-date { white-space:nowrap; color:#6f6552; font-size:11px; }
		.rp .rp-table tbody tr:nth-child(even) td { background:#fbf9f5; }
		.rp .rp-table tr.rp-total td { border-bottom:0; border-top:1px solid #14213a; background:#f7f4ee; color:#14213a; font-weight:700; }
		.rp .rp-table tr.rp-words td { border-bottom:0; background:#fff; color:#8a7f6a; font-family:var(--serif); font-size:11px; font-style:italic; }
		.rp .rp-table tr.rp-words b { color:#14213a; font-style:normal; }
		.rp .rp-empty { padding:16px; border:1px solid #e2dccd; border-left:3px solid #a8844a; background:#fbf9f5; color:#6f6552; }
		.rp .rp-sign { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:40px; }
		.rp .rp-sign .line { height:36px; border-bottom:1px solid #14213a; }
		@media(max-width:900px) { .rp .rp-brand b { font-size:23px; } .report-sheet { padding:12px 10px; } .rp .rp-table th,.rp .rp-table td { padding:6px 5px; font-size:11px; } }
		@media(max-width:640px) { .rp .rp-meta>div { min-width:0; padding:8px 12px; } .rp .rp-info { grid-template-columns:1fr; } .rp .rp-sign { grid-template-columns:1fr; gap:10px; } .grid-wrap { overflow:auto; } }
		@media print {
			@page { size:A4 landscape; margin:10mm; }
			:root { color-scheme:light; }
			* { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
			body.report-open { background:#fff !important; }
			body.report-open .bg-media,body.report-open .shell > *:not(#report-view),body.report-open .report-bar { display:none !important; }
			body.report-open .shell { max-width:none; padding:0; }
			body.report-open .report-sheet { max-width:none; margin:0; padding:0; border:0; border-radius:0; box-shadow:none; background:#fff; }
			.rp .rp-table tr { break-inside:avoid; }
			.rp .rp-top { break-after:avoid; }
		}
		@media(max-width:700px) { .shell { padding:25px 15px 40px; } .intro { align-items:start; flex-direction:column; } .intro p { max-width:none; } .cal-top { padding:16px; } }
	</style>
</head>
<body>
	<script src="auth-gate.js"></script>
	<script>akgarageInitGate();</script>
	<div class="bg-media" aria-hidden="true"><img class="bg-photo" src="assets/hero-car.jpg?v=3" alt=""></div>
	<div class="shell">
		<header class="topbar">
			<div class="brand"><span class="mark">AK</span><span><strong>AK GARAGE</strong><small>MODIFICATION LAB</small></span></div>
			<a class="back" href="index.html"><i data-lucide="arrow-left"></i> Back to overview</a>
		</header>
		<section class="intro">
			<div><p class="eyebrow">Workspace / Fleet Audit Report</p><h1>Fleet Audit Report</h1></div>
			<p>Monthly fleet calendar. Click any date to open that day's expense report.</p>
		</section>

		<div class="calendar">
			<div class="cal-top">
				<h2 class="cal-month" id="cal-month">Loading…</h2>
				<div class="cal-total"><span id="cal-total-label">Month total</span><b id="cal-total-value">AED 0</b></div>
				<div class="cal-tools">
					<input type="date" class="range-date" id="cal-from-date" aria-label="From date">
					<span class="range-dash">to</span>
					<input type="date" class="range-date" id="cal-to-date" aria-label="To date">
					<button class="cal-week-link" id="range-link" type="button">Fleet Audit</button>
					<button class="cal-btn" id="cal-prev" type="button" aria-label="Previous month"><i data-lucide="chevron-left"></i></button>
					<button class="cal-btn" id="cal-today" type="button">Today</button>
					<button class="cal-btn" id="cal-next" type="button" aria-label="Next month"><i data-lucide="chevron-right"></i></button>
				</div>
			</div>
			<div class="grid-wrap">
				<div class="cal-grid" id="cal-grid"></div>
			</div>
		</div>

		<div id="report-view" hidden>
			<div class="report-bar">
				<button class="rbtn ghost" id="report-back" type="button">Back</button>
				<button class="rbtn" id="report-add" type="button">Add Report</button>
				<button class="rbtn ghost" id="report-edit" type="button">Edit</button>
				<button class="rbtn ghost danger" id="report-delete" type="button">Delete</button>
				<button class="rbtn" id="report-print" type="button">Print</button>
				<button class="rbtn ghost" id="report-save" type="button">Save as PDF</button>
				<input type="date" class="range-date" id="report-from-date" aria-label="From date" hidden>
				<span class="range-dash" id="report-range-dash" hidden>to</span>
				<input type="date" class="range-date" id="report-to-date" aria-label="To date" hidden>
				<span class="report-status" id="report-status"></span>
			</div>
			<form class="report-form" id="report-form" hidden>
				<div class="rf-grid">
					<div class="rf-field"><label>Date</label><input type="date" id="rf-date"></div>
					<div class="rf-field"><label>Car Model</label><input type="text" id="rf-car" list="rf-car-list" placeholder="Pick or type a new car" autocomplete="off"><datalist id="rf-car-list"></datalist><small class="rf-hint">Type a new model to add it as a build.</small></div>
					<div class="rf-field"><label>Part No.</label><input type="text" id="rf-part" placeholder="Optional"></div>
					<div class="rf-field"><label>Item / Part Name</label><input type="text" id="rf-item" placeholder="e.g. Oil filter"></div>
					<div class="rf-field"><label>Shop / Supplier</label><input type="text" id="rf-shop" placeholder="Optional"></div>
					<div class="rf-field"><label>Qty</label><input type="number" id="rf-qty" value="1" min="0" step="any"></div>
					<div class="rf-field"><label>Unit Price (AED)</label><input type="number" id="rf-unit" value="0" min="0" step="any"></div>
					<div class="rf-field"><label>Payment Method</label><select id="rf-pay"></select></div>
					<div class="rf-field"><label>Category</label><select id="rf-cat"></select></div>
				</div>
				<div class="rf-actions">
					<button class="rbtn" id="rf-save" type="submit">Save expense</button>
					<button class="rbtn ghost" id="rf-cancel" type="button">Cancel</button>
				</div>
			</form>
			<div class="report-sheet"><div id="report-body"></div></div>
		</div>
	</div>
	<script>
		lucide.createIcons();

		const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
		const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
		const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
		const CATEGORIES = ['Exhaust', 'Engine', 'Wheels', 'Exterior', 'Interior', 'Suspension', 'Electronics', 'Labor', 'Oil', 'Other'];
		const PAYMENTS = ['Cash', 'Card', 'Bank transfer', 'Other'];

		const $ = (id) => document.getElementById(id);
		const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

		const grid = $('cal-grid');
		const monthLabel = $('cal-month');
		let view = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
		let selectedKey = isoKey(new Date());
		let dayTotals = new Map();

		function refreshDayTotals(lines) {
			dayTotals = new Map();
			lines.forEach((line) => {
				if (!line.date) return;
				dayTotals.set(line.date, (dayTotals.get(line.date) || 0) + (Number(line.total) || 0));
			});
		}

		function pad(value) { return String(value).padStart(2, '0'); }
		function isoKey(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
		function prettyDate(key) {
			const date = new Date(key + 'T00:00:00');
			if (Number.isNaN(date.getTime())) return key;
			return `${date.getDate()} ${MONTHS_SHORT[date.getMonth()]} ${date.getFullYear()}`;
		}
		function moneyText(value) {
			return 'AED ' + new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(Number(value) || 0);
		}
		// Amount in words, e.g. 294 -> "Two Hundred Ninety-Four".
		function numberWords(value) {
			const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
			const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
			const scales = ['', 'Thousand', 'Million', 'Billion', 'Trillion'];
			const below1000 = (n) => {
				const parts = [];
				if (n >= 100) { parts.push(ones[Math.floor(n / 100)] + ' Hundred'); n %= 100; }
				if (n >= 20) parts.push(tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : ''));
				else if (n > 0) parts.push(ones[n]);
				return parts.join(' ');
			};
			let n = Math.round(Math.abs(Number(value) || 0));
			if (!n) return 'Zero';
			const groups = [];
			let scale = 0;
			while (n > 0) {
				const chunk = n % 1000;
				if (chunk) groups.unshift(below1000(chunk) + (scales[scale] ? ' ' + scales[scale] : ''));
				n = Math.floor(n / 1000);
				scale += 1;
			}
			return groups.join(' ');
		}

		// ISO week number for the Monday of the row, so the left column keeps
		// counting like a paper calendar.
		function weekNumber(date) {
			const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
			const dayNumber = (target.getDay() + 6) % 7;
			target.setDate(target.getDate() - dayNumber + 3);
			const firstThursday = new Date(target.getFullYear(), 0, 4);
			const firstDayNumber = (firstThursday.getDay() + 6) % 7;
			firstThursday.setDate(firstThursday.getDate() - firstDayNumber + 3);
			return 1 + Math.round((target - firstThursday) / 604800000);
		}

		function renderCalendar() {
			const year = view.getFullYear();
			const month = view.getMonth();
			monthLabel.innerHTML = `${MONTHS[month]} <span>${year}</span>`;

			// Grand total of every expense recorded inside the month being viewed.
			const prefix = `${year}-${pad(month + 1)}`;
			let monthTotal = 0;
			dayTotals.forEach((value, key) => { if (String(key).startsWith(prefix)) monthTotal += value; });
			$('cal-total-label').textContent = `${MONTHS[month]} ${year} total`;
			$('cal-total-value').textContent = moneyText(monthTotal);

			const first = new Date(year, month, 1);
			const start = new Date(year, month, 1 - first.getDay());
			const todayKey = isoKey(new Date());

			grid.innerHTML = '';
			const weekHead = document.createElement('div');
			weekHead.className = 'cal-dow week';
			weekHead.textContent = 'WK';
			grid.appendChild(weekHead);
			DOW.forEach((label) => {
				const head = document.createElement('div');
				head.className = 'cal-dow';
				head.textContent = label;
				grid.appendChild(head);
			});

			for (let week = 0; week < 6; week += 1) {
				const rowStart = new Date(start.getFullYear(), start.getMonth(), start.getDate() + week * 7);
				const weekCell = document.createElement('div');
				weekCell.className = 'cal-week';
				weekCell.textContent = String(weekNumber(rowStart));
				grid.appendChild(weekCell);

				for (let day = 0; day < 7; day += 1) {
					const current = new Date(rowStart.getFullYear(), rowStart.getMonth(), rowStart.getDate() + day);
					const key = isoKey(current);
					const cell = document.createElement('button');
					cell.type = 'button';
					cell.className = 'cal-cell';
					if (current.getMonth() !== month) cell.classList.add('out');
					if (key === todayKey) cell.classList.add('today');
					if (key === selectedKey) cell.classList.add('selected');
					const dayTotal = dayTotals.get(key);
					if (dayTotal) {
						cell.classList.add('has-expense');
						const amount = document.createElement('span');
						amount.className = 'cal-amount';
						amount.textContent = moneyText(dayTotal);
						cell.appendChild(amount);
					}
					cell.dataset.date = key;
					cell.setAttribute('aria-label', `${DOW[current.getDay()]} ${current.getDate()} ${MONTHS[current.getMonth()]} ${current.getFullYear()}`);

					const dateTag = document.createElement('span');
					dateTag.className = 'cal-date';
					dateTag.textContent = String(current.getDate());
					cell.appendChild(dateTag);

					grid.appendChild(cell);
				}
			}
		}

			const cell = event.target.closest('.cal-cell');
			if (!cell) return;
			selectedKey = cell.dataset.date;

		document.getElementById('cal-next').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCalendar(); });

		/* ===== Day expense report (same sheet design as the maintenance report) ===== */
		const EXPENSE_TABLE = 'modifications';
		let allLines = null;
		let allJobs = null;
		let reportRows = [];
		let reportKey = null;
		let reportMode = 'day';
		let editing = false;
		let rangeStart = null;
		let rangeEnd = null;

		const lineTotal = (line) => (Number(line && line.qty) || 0) * (Number(line && line.unit_price) || 0);
		const grandOf = (expenses) => (Array.isArray(expenses) ? expenses : []).reduce((sum, line) => sum + lineTotal(line), 0);
		const jobById = (id) => (allJobs || []).find((row) => row.id === id);
		const jobTitle = (job, fallback) => String(job.title || job.plate || fallback);

		function reportRange() {
			if (reportMode === 'range' && rangeStart) return { start: rangeStart, end: rangeEnd };
			const key = reportKey || selectedKey;
			return { start: key, end: key };
		}

		function reportStamp() {
			const { start, end } = reportRange();
			return start === end ? prettyDate(start).toUpperCase() : `${prettyDate(start).toUpperCase()} – ${prettyDate(end).toUpperCase()}`;
		}

		function reportFileKey() {
			const { start, end } = reportRange();
			return start === end ? start : `${start}-to-${end}`;
		}

		function pickRows(lines) {
			const { start, end } = reportRange();
			return lines
				.filter((line) => line.date && line.date >= start && line.date <= end)
				.sort((a, b) => (a.date === b.date ? 0 : a.date < b.date ? -1 : 1));
		}

		async function loadExpenseLines() {
			if (allLines) return allLines;
			if (!window.sb) throw new Error('Supabase is not available.');
			const { data, error } = await window.sb.from(EXPENSE_TABLE).select('*').order('created_at', { ascending: false });
			if (error) throw error;
			allJobs = (Array.isArray(data) ? data : []).filter((job) => job && typeof job === 'object');
			const lines = [];
			allJobs.forEach((job) => {
				const car = jobTitle(job, '--');
				(Array.isArray(job.expenses) ? job.expenses : []).forEach((line, index) => {
					const qty = Number(line.qty) || 0;
					const unit = Number(line.unit_price) || 0;
					lines.push({
						jobId: job.id,
						index,
						date: String(line.date || ''),
						car,
						part: String(line.part_no || '--'),
						item: String(line.item || '--'),
						shop: String(line.shop || '--'),
						qty,
						unit,
						total: qty * unit,
						pay: String(line.payment || '--')
					});
				});
			});
			allLines = lines;
			return lines;
		}

		// Shared reset for every way of opening a report: leave edit mode, restore the
		// buttons and hide the range pickers until a range report turns them back on.
		function resetReportChrome() {
			editing = false;
			$('report-edit').textContent = 'Edit';
			$('report-add').disabled = false;
			$('report-form').hidden = true;
			['report-from-date', 'report-to-date', 'report-range-dash'].forEach((id) => { $(id).hidden = true; });
		}

		function showReport() {
			reportRows = [];
			$('report-view').hidden = false;
			document.body.classList.add('report-open');
			$('report-status').textContent = 'Loading…';
			$('report-body').innerHTML = '';
			window.scrollTo({ top: 0, behavior: 'smooth' });
			loadExpenseLines()
				.then((lines) => {
					reportRows = pickRows(lines);
					$('report-status').textContent = '';
					renderDayReport();
				})
				.catch((error) => {
					console.error('Unable to load expenses:', error);
					$('report-status').textContent = 'Could not load expenses';
					renderDayReport();
				});
		}

		// After a write: refetch once, then refresh the calendar totals and the sheet.
		async function reloadAfterWrite() {
			resetReportChrome();
			allLines = null;
			allJobs = null;
			const lines = await loadExpenseLines();
			refreshDayTotals(lines);
			reportRows = pickRows(lines);
			renderCalendar();
			renderDayReport();
		}

		function openDayReport(key) {
			resetReportChrome();
			reportMode = 'day';
			rangeStart = null;
			rangeEnd = null;
			reportKey = key;
			showReport();
		}

		function openRangeReport(fromKey, toKey) {
			resetReportChrome();
			let start = fromKey || $('cal-from-date').value || selectedKey;
			let end = toKey || $('cal-to-date').value || start;
			if (end < start) { const swap = start; start = end; end = swap; }
			reportMode = 'range';
			rangeStart = start;
			rangeEnd = end;
			reportKey = start;
			$('cal-from-date').value = start;
			$('cal-to-date').value = end;
			// Keep the calendar on the month of the chosen range when you come back.
			const startDate = new Date(start + 'T00:00:00');
			if (!Number.isNaN(startDate.getTime())) view = new Date(startDate.getFullYear(), startDate.getMonth(), 1);

		async function saveExpenseLine(event) {
			event.preventDefault();
			const status = $('report-status');
			const carName = $('rf-car').value.trim();
			const item = $('rf-item').value.trim();
			const unit = Number($('rf-unit').value) || 0;
			if (!carName) { status.textContent = 'Pick or type a car model'; return; }
			if (!item) { status.textContent = 'Expense needs an item / part name'; return; }
			if (unit <= 0) { status.textContent = 'Expense needs a unit price'; return; }
			if (!window.sb) { status.textContent = 'Supabase is not available'; return; }

			const same = (value) => String(value || '').trim().toLowerCase();
			const job = (allJobs || []).find((row) => same(row.title || row.plate) === same(carName));
			const line = {
				date: $('rf-date').value || reportKey,
				category: $('rf-cat').value,
				part_no: $('rf-part').value.trim(),
				item,
				shop: $('rf-shop').value.trim(),
				qty: Number($('rf-qty').value) || 1,
				unit_price: unit,
				payment: $('rf-pay').value,
				notes: ''
			};
			const expenses = (job && Array.isArray(job.expenses) ? job.expenses : []).concat([line]);
			const grand = grandOf(expenses);

			const saveBtn = $('rf-save');
			saveBtn.disabled = true;
			status.textContent = 'Saving…';
			try {
				let data, error;
				if (job) {
					const pnl = (Number(job.sold_price) || 0) - grand;
					({ data, error } = await window.sb.from(EXPENSE_TABLE).update({ expenses, grand_total: grand, pnl }).eq('id', job.id).select());
				} else {
					// Brand new car typed in the form — create its build so the expense has a home.
					({ data, error } = await window.sb.from(EXPENSE_TABLE).insert({
						title: carName,
						chassis: '',
						status: 'In progress',
						progress: 0,
						due_date: null,
						sold_price: null,
						description: '',
						expenses,
						grand_total: grand,
						pnl: -grand
					}).select());
				}
				if (error) throw error;
				if (!(data || []).length) throw new Error('Session expired — log in as admin to save changes.');
				await reloadAfterWrite();
				status.textContent = 'Expense saved ✓';
			} catch (error) {
				console.error('Unable to save the expense:', error);
				status.textContent = error.message || 'Could not save the expense';
			} finally {
				saveBtn.disabled = false;
			}
		}

				const rowTotal = (Number(tr.querySelector('.ed-qty').value) || 0) * (Number(tr.querySelector('.ed-unit').value) || 0);

		function wireEditRows() {
			document.querySelectorAll('#report-body .ed-qty, #report-body .ed-unit').forEach((input) => input.addEventListener('input', recalcEditTotals));

		async function saveEdits() {
			const status = $('report-status');
			const trs = [...document.querySelectorAll('#report-body tbody tr[data-job]')];
			const byJob = new Map();
			for (const tr of trs) {
				const item = tr.querySelector('.ed-item').value.trim();
				const unit = Number(tr.querySelector('.ed-unit').value) || 0;
				if (!item || unit <= 0) { status.textContent = 'Every row needs an item and a unit price'; return; }
				const jobId = tr.dataset.job;
				if (!byJob.has(jobId)) byJob.set(jobId, []);
				byJob.get(jobId).push({
					idx: Number(tr.dataset.idx),
					patch: {
						date: tr.querySelector('.ed-date').value || '',
						part_no: tr.querySelector('.ed-part').value.trim(),
						item,
						shop: tr.querySelector('.ed-shop').value.trim(),
						qty: Number(tr.querySelector('.ed-qty').value) || 0,
						unit_price: unit,
						payment: tr.querySelector('.ed-pay').value
					}
				});
			}
			if (!window.sb) { status.textContent = 'Supabase is not available'; return; }

			status.textContent = 'Saving…';
			try {
				const jobIds = [...new Set(reportRows.map((row) => row.jobId))];
				for (const jobId of jobIds) {
					const job = jobById(jobId);
					if (!job) continue;
					const edits = byJob.get(jobId) || [];
					const kept = new Set(edits.map((edit) => edit.idx));
					const removed = reportRows.filter((row) => row.jobId === jobId && !kept.has(row.index)).map((row) => row.index);
					const expenses = (Array.isArray(job.expenses) ? job.expenses : [])
						.map((line, i) => {
							const edit = edits.find((row) => row.idx === i);
							return edit ? { ...line, ...edit.patch } : line;
						})
						.filter((_, i) => !removed.includes(i));
					const grand = grandOf(expenses);
					const pnl = (Number(job.sold_price) || 0) - grand;
					const { data, error } = await window.sb.from(EXPENSE_TABLE).update({ expenses, grand_total: grand, pnl }).eq('id', jobId).select();
					if (error) throw error;
					if (!(data || []).length) throw new Error('Session expired — log in as admin to save changes.');
				}
				await reloadAfterWrite();
				status.textContent = 'Changes saved ✓';
			} catch (error) {
				console.error('Unable to save the edits:', error);
				status.textContent = error.message || 'Could not save the changes';
			}
		}

		async function deleteReport() {
			const status = $('report-status');
			if (!reportRows.length) { status.textContent = 'Nothing to delete here'; return; }
			if (!window.sb) { status.textContent = 'Supabase is not available'; return; }
			const label = reportMode === 'range' ? reportStamp() : prettyDate(reportKey || selectedKey);
			const count = reportRows.length;
			if (!window.confirm(`Delete ${count} expense ${count === 1 ? 'entry' : 'entries'} for ${label}? This cannot be undone.`)) return;

			status.textContent = 'Deleting…';
			try {
				const jobIds = [...new Set(reportRows.map((row) => row.jobId))];
				for (const jobId of jobIds) {
					const job = jobById(jobId);
					if (!job) continue;
					const drop = reportRows.filter((row) => row.jobId === jobId).map((row) => row.index);
					const expenses = (Array.isArray(job.expenses) ? job.expenses : []).filter((_, i) => !drop.includes(i));
					const grand = grandOf(expenses);
					const pnl = (Number(job.sold_price) || 0) - grand;
					const { data, error } = await window.sb.from(EXPENSE_TABLE).update({ expenses, grand_total: grand, pnl }).eq('id', jobId).select();
					if (error) throw error;
					if (!(data || []).length) throw new Error('Session expired — log in as admin to delete entries.');
				}
								await reloadAfterWrite();
				status.textContent = 'Expense deleted ✓';
			} catch (error) {
				console.error('Unable to delete the report:', error);
				status.textContent = error.message || 'Could not delete the report';
			}
		}

		let jspdfPromise = null;
		function loadJsPdf() {
			if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
			if (!jspdfPromise) {
				jspdfPromise = new Promise((resolve, reject) => {
					const script = document.createElement('script');
					script.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
					script.onload = () => resolve(window.jspdf.jsPDF);
					script.onerror = () => reject(new Error('Unable to load the PDF library.'));
					document.head.appendChild(script);
				});
			}
			return jspdfPromise;
		}

		async function saveDayPdf() {
			const status = $('report-status');
			const key = reportFileKey();
			const isRange = reportMode === 'range';
			const stamp = reportStamp();
			status.textContent = 'Building PDF…';
			try {
				const JsPDF = await loadJsPdf();
				const pdf = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
				const NAVY = [20, 33, 58], GOLD = [168, 132, 74], LIGHT_GOLD = [201, 169, 106], INK = [43, 42, 38], MUTED = [138, 127, 106], LINE = [226, 220, 205], PANEL = [247, 244, 238];
				const P = 12, W = 297 - P * 2, L = P;
				const TOP = P;
				const rows = reportRows;
				const total = rows.reduce((sum, line) => sum + line.total, 0);

				let y = P;
				pdf.setFillColor(...NAVY); pdf.rect(L, y, W, 20, 'F');
				pdf.setFillColor(...GOLD); pdf.rect(L, y + 20, W, 0.8, 'F');
				pdf.setTextColor(...LIGHT_GOLD); pdf.setFont('times', 'bold'); pdf.setFontSize(20);
				pdf.text(isRange ? 'FLEET AUDIT' : 'EXPENSE REPORT', L + 6, y + 10.5);
				pdf.setFont('times', 'normal'); pdf.setFontSize(8.5);
				pdf.text(isRange ? 'DATE RANGE SUMMARY' : 'MAINTENANCE / MODIFICATION', L + 6, y + 16.5);
				pdf.setDrawColor(...GOLD); pdf.setFillColor(27, 43, 73);
				pdf.roundedRect(L + W - 62, y + 4, 56, 12, 2, 2, 'FD');
				pdf.setTextColor(...LIGHT_GOLD); pdf.setFontSize(8);
				pdf.text(isRange ? 'PERIOD' : 'DATE', L + W - 58, y + 8.6);
				pdf.setTextColor(255, 255, 255); pdf.setFont('times', 'bold'); pdf.setFontSize(isRange ? 8.5 : 11);
				pdf.text(stamp, L + W - 58, y + 13.6);
				y += 26;

				const cw = [22, 44, 20, 62, 44, 10, 24, 26];
				cw.push(W - cw.reduce((a, b) => a + b, 0));
				const heads = ['DATE', 'CAR MODEL', 'PART NO.', 'ITEM / PART NAME', 'SHOP / SUPPLIER', 'QTY', 'UNIT (AED)', 'TOTAL (AED)', 'PAYMENT'];
				const cols = [0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => cw.slice(0, i).reduce((a, b) => a + b, 0));

				const tableHead = () => {
					pdf.setFillColor(...NAVY); pdf.rect(L, y, W, 7, 'F');
					pdf.setTextColor(255, 255, 255); pdf.setFont('times', 'bold'); pdf.setFontSize(7);
					heads.forEach((head, i) => {
						const right = i === 5 || i === 6 || i === 7;
						pdf.text(head, right ? L + cols[i] + cw[i] - 2 : L + cols[i] + 2, y + 4.7, right ? { align: 'right' } : undefined);
					});
					y += 7;
				};
				tableHead();

				if (!rows.length) {
					pdf.setTextColor(...MUTED); pdf.setFont('times', 'italic'); pdf.setFontSize(9);
					pdf.text(isRange ? 'No expenses recorded in this date range.' : 'No expenses recorded on this date.', L + 3, y + 6);
					y += 12;
				}

				rows.forEach((line, index) => {
					pdf.setFont('times', 'normal'); pdf.setFontSize(8);
					const itemLines = pdf.splitTextToSize(String(line.item), cw[3] - 4);
					const carLines = pdf.splitTextToSize(String(line.car), cw[1] - 4);
					const shopLines = pdf.splitTextToSize(String(line.shop), cw[4] - 4);
					const rowH = Math.max(7, Math.max(itemLines.length, carLines.length, shopLines.length) * 3.8 + 2.6);
					if (y + rowH > 210 - P - 6) { pdf.addPage(); y = TOP; tableHead(); }
					if (index % 2 === 1) { pdf.setFillColor(...PANEL); pdf.rect(L, y, W, rowH, 'F'); }
					pdf.setTextColor(...INK); pdf.setFont('times', 'normal'); pdf.setFontSize(7.5);
					pdf.text(pdf.splitTextToSize(prettyDate(line.date) || '--', cw[0] - 4)[0], L + cols[0] + 2, y + 4.2);
					carLines.forEach((text, k) => pdf.text(text, L + cols[1] + 2, y + 4.2 + k * 3.8));
					pdf.setTextColor(...MUTED);
					pdf.text(pdf.splitTextToSize(String(line.part), cw[2] - 4)[0], L + cols[2] + 2, y + 4.2);
					pdf.setTextColor(...INK); pdf.setFontSize(8);
					itemLines.forEach((text, k) => pdf.text(text, L + cols[3] + 2, y + 4.2 + k * 3.8));
					pdf.setTextColor(...MUTED); pdf.setFontSize(7.5);
					shopLines.forEach((text, k) => pdf.text(text, L + cols[4] + 2, y + 4.2 + k * 3.8));
					pdf.setTextColor(...INK); pdf.setFontSize(8);
					pdf.text(String(line.qty || 0), L + cols[5] + cw[5] - 2, y + 4.2, { align: 'right' });
					pdf.text(moneyText(line.unit), L + cols[6] + cw[6] - 2, y + 4.2, { align: 'right' });
					pdf.setFont('times', 'bold');
					pdf.text(moneyText(line.total), L + cols[7] + cw[7] - 2, y + 4.2, { align: 'right' });
					pdf.setFont('times', 'normal'); pdf.setFontSize(7.5);
					pdf.setTextColor(...MUTED);
					pdf.text(pdf.splitTextToSize(String(line.pay), cw[8] - 4)[0], L + cols[8] + 2, y + 4.2);
					pdf.setDrawColor(...LINE); pdf.setLineWidth(0.2); pdf.line(L, y + rowH, L + W, y + rowH);
					y += rowH;
				});

				if (y + 14 > 210 - P - 6) { pdf.addPage(); y = TOP; }
				pdf.setFillColor(...PANEL); pdf.rect(L, y, W, 10, 'F');
				pdf.setDrawColor(...NAVY); pdf.setLineWidth(0.4); pdf.line(L, y, L + W, y);
				pdf.setTextColor(...NAVY); pdf.setFont('times', 'bold'); pdf.setFontSize(8.5);
				pdf.text('NET AMOUNT', L + 3, y + 6.4);
				pdf.setFontSize(10.5);
				pdf.text(moneyText(total), L + W - 3, y + 6.6, { align: 'right' });
				y += 12;
				pdf.setFont('times', 'italic'); pdf.setFontSize(8);
				pdf.setTextColor(...MUTED);
				pdf.text('Amount in words: ' + numberWords(total), L + 3, y + 3);
				y += 16;

				if (y + 18 < 210 - P) {
					pdf.setDrawColor(...NAVY); pdf.setLineWidth(0.3);
					const signW = (W - 12) / 2;
					[0, 1].forEach((i) => {
						const x = L + i * (signW + 12);
						pdf.line(x, y + 8, x + signW, y + 8);
					});
				}

				pdf.save(`${isRange ? 'fleet-audit' : 'expense-report'}-${key}.pdf`);
				status.textContent = 'PDF saved ✓';
			} catch (error) {
				console.error('Unable to build the PDF:', error);
				status.textContent = 'Could not build the PDF';
			}
		}

		$('report-add').addEventListener('click', openExpenseForm);
		$('report-form').addEventListener('submit', saveExpenseLine);
		$('rf-cancel').addEventListener('click', () => { $('report-form').hidden = true; $('report-status').textContent = ''; });
		$('report-edit').addEventListener('click', () => {
			if (!editing) {
				if (!reportRows.length) { $('report-status').textContent = 'No expenses to edit'; return; }
				editing = true;
				$('report-edit').textContent = 'Save changes';
				$('report-add').disabled = true;
				$('report-form').hidden = true;
				$('report-status').textContent = 'Editing — change a value or remove a row';
				renderDayReport();
				return;
			}
			const button = $('report-edit');
			button.disabled = true;
			saveEdits().finally(() => { button.disabled = false; });
		});
		$('report-delete').addEventListener('click', async () => {
			const button = $('report-delete');
			button.disabled = true;
			await deleteReport().finally(() => { button.disabled = false; });
		});
		$('range-link').addEventListener('click', () => openRangeReport($('cal-from-date').value, $('cal-to-date').value));
		['cal-from-date', 'cal-to-date'].forEach((id) => {
			$(id).addEventListener('change', () => {
				if ($('cal-from-date').value && $('cal-to-date').value) openRangeReport($('cal-from-date').value, $('cal-to-date').value);
			});
		});
		['report-from-date', 'report-to-date'].forEach((id) => {
			$(id).addEventListener('change', () => {
				if ($('report-from-date').value && $('report-to-date').value) openRangeReport($('report-from-date').value, $('report-to-date').value);
			});
		});
		$('report-back').addEventListener('click', closeDayReport);
		$('report-print').addEventListener('click', () => { window.print(); });
		$('report-save').addEventListener('click', () => { const btn = $('report-save'); btn.disabled = true; saveDayPdf().finally(() => { btn.disabled = false; }); });

		// Default From / To to the current Sunday → Saturday range; both are editable.
		(function seedRange() {
			const now = new Date();
			const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
			const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
			$('cal-from-date').value = isoKey(start);
			$('cal-to-date').value = isoKey(end);
		})();
		renderCalendar();
		// Mark every calendar date that already has a saved expense report.
		loadExpenseLines()
			.then((lines) => {
				refreshDayTotals(lines);
				renderCalendar();
			})
			.catch((error) => console.error('Unable to load expense dates:', error));
	</script>
</body>
</html>
